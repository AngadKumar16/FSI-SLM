dataset:
  n_per_regime: 40
  output_dir: artifacts/dataset
  paraphrase: false
  test_ratio: 0.1
  train_ratio: 0.8
  val_ratio: 0.1
eval:
  freq_tolerance: 0.15
  output_dir: artifacts/eval_results
  regime_f1_threshold: 0.5
inference:
  adapter_path: artifacts/adapters_v3
  max_tokens: 350
  model_name: ./artifacts/models/Phi-4-mini-instruct
  rag_index_dir: artifacts/rag_index
  rag_score_threshold: 0.3
  rag_top_k: 3
  seed: 42
  temperature: 0.0
  top_p: 1.0
model_cache_dir: artifacts/models
model_name: microsoft/Phi-4-mini-instruct
rag:
  chunk_overlap: 128
  chunk_size: 256
  corpus_dir: Data/Papers
  embedding_model: all-MiniLM-L6-v2
  index_dir: artifacts/rag_index
  index_type: Flat
  score_threshold: 0.3
  top_k: 3
seed: 42
serve:
  host: 0.0.0.0
  max_retrieved: 5
  port: 8000
training:
  adapter_path: artifacts/adapters
  batch_size: 4
  checkpoint_dir: artifacts/checkpoints
  dataset_dir: artifacts/dataset
  epochs: 3
  eval_every: 200
  grad_accum_steps: 2
  grad_checkpoint: false
  iters: 0
  learning_rate: 0.0002
  lora_alpha: 16
  lora_dropout: 0.05
  lora_rank: 8
  mask_prompt: true
  max_seq_length: 2048
  num_layers: -1
  resume_from_checkpoint: null
  save_every: 500
  val_batches: 25
  warmup_steps: 50
